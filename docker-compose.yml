services:
  # The API and the whole pipeline: the local models run here, on the GPU, one at a time.
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: ai-shorts-api:latest
    container_name: ai-shorts-api
    restart: unless-stopped
    gpus: all
    # Named volumes, not folders of the Windows disk: the models (12 GB) load from WSL's own disk, fast.
    volumes:
      - models:/models
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/voices').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      # the first start downloads the models
      start_period: 30m
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The front: nginx serving the app and passing /api to the API. The only published port, on this PC only.
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: ai-shorts-web:latest
    container_name: ai-shorts-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8765}:8080"
    # the basic-auth login: required, nginx does not start without it
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD in .env}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  models:
  data:
