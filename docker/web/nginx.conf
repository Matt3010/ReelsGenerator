# The only way in: the Svelte app, and /api passed to the API container (which has no published port).
# Compose binds it to 127.0.0.1 only; nginx runs as a user and listens on 8080 inside.

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    autoindex off;

    # The largest request is a new job: a topic and a news link.
    client_max_body_size 16k;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # No hidden files, even if one ever lands here by mistake.
    location ~ /\. {
        return 404;
    }

    # The app: any path that is not a file is the app.
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Vite's bundles carry a hash in the name, so they never change: cached for a year.
    location /assets/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The API, resolved at request time, so nginx starts even while the API is down (it loads models at start).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://ai-shorts-api:3000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # today's news reads three feeds: give it time
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # The videos: streamed as they come (the player asks for byte ranges to seek), no copy on nginx's disk.
    location ~ ^/api/jobs/[0-9a-f-]+/video$ {
        limit_except GET HEAD { deny all; }
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
