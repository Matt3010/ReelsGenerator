<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Shorts</title>
<style>
  :root { --bg:#14111c; --card:#1f1a2b; --line:#2f2840; --text:#f3eefc; --muted:#a69cbc; --accent:#ffcf4a; --ok:#53d18b; --err:#ff6b6b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, "Segoe UI", sans-serif }
  main { max-width:980px; margin:0 auto; padding:24px 16px 60px }
  h1 { font-size:26px; margin:0 0 4px } h1 span { color:var(--accent) }
  .sub { color:var(--muted); margin:0 0 22px }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px }
  textarea { width:100%; min-height:64px; resize:vertical; background:#120f19; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px }
  button, select { font:inherit; border-radius:10px; border:1px solid var(--line); background:#2a2339; color:var(--text); padding:10px 14px; cursor:pointer }
  button:hover { border-color:#4a3f63 }
  button.primary { background:var(--accent); color:#1b1400; border:none; font-weight:700; padding:12px 20px }
  button:disabled { opacity:.5; cursor:wait }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px }
  .chip { background:#2a2339; border:1px solid var(--line); border-radius:999px; padding:7px 12px; cursor:pointer }
  .chip:hover { border-color:var(--accent) }
  label.toggle { display:flex; gap:6px; align-items:center; color:var(--muted); cursor:pointer }
  h2 { font-size:18px; margin:28px 0 12px }
  .jobs { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px }
  .job { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column }
  .job video { width:100%; aspect-ratio:9/16; background:#000; display:block }
  .ph { aspect-ratio:9/16; display:grid; place-items:center; background:repeating-linear-gradient(45deg,#1a1524,#1a1524 12px,#1d1828 12px,#1d1828 24px); color:var(--muted); text-align:center; padding:20px }
  .spin { width:34px; height:34px; border:4px solid #3a3150; border-top-color:var(--accent); border-radius:50%; animation:r 1s linear infinite; margin:0 auto 10px }
  @keyframes r { to { transform:rotate(360deg) } }
  .meta { padding:12px 14px; display:flex; flex-direction:column; gap:6px }
  .title { font-weight:700 } .topic { color:var(--muted); font-size:13px }
  .state { font-size:13px } .state.done { color:var(--ok) } .state.error { color:var(--err) }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px } .acts a, .acts button { font-size:13px; padding:7px 10px; color:var(--text); text-decoration:none; border:1px solid var(--line); border-radius:8px; background:#2a2339 }
  .script { font-size:13px; color:#d8d0e8; background:#16121f; border-radius:10px; padding:10px; white-space:pre-wrap; display:none }
  .err { color:var(--err); font-size:12px; word-break:break-word }
</style>
</head>
<body>
<main>
  <h1>AI <span>Shorts</span></h1>
  <p class="sub">Scrivi un argomento (o scegline uno tra le idee): Claude scrive la storia, la voce la racconta, il motore 3D la anima.</p>

  <section class="panel">
    <textarea id="topic" placeholder="es. The Great Molasses Flood of Boston, 1919"></textarea>
    <div class="row">
      <button id="ideas">💡 Idee</button>
      <select id="voice"></select>
      <label class="toggle"><input type="checkbox" id="captions" checked> Sottotitoli</label>
      <span style="flex:1"></span>
      <button class="primary" id="go">Genera video</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <h2>I tuoi video</h2>
  <div class="jobs" id="jobs"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL = { queued: "In coda", running: "In lavorazione", done: "Pronto", error: "Errore" };

async function loadVoices() {
  const v = await (await fetch("/api/voices")).json();
  $("#voice").innerHTML = Object.entries(v).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join("");
}

$("#ideas").onclick = async () => {
  const b = $("#ideas"); b.disabled = true; b.textContent = "💡 Claude ci pensa…";
  try {
    const list = await (await fetch("/api/ideas")).json();
    $("#chips").innerHTML = list.map((t) => `<span class="chip">${esc(t)}</span>`).join("");
    document.querySelectorAll(".chip").forEach((c) => c.onclick = () => { $("#topic").value = c.textContent; });
  } finally { b.disabled = false; b.textContent = "💡 Altre idee"; }
};

$("#go").onclick = async () => {
  const topic = $("#topic").value.trim();
  if (!topic) { $("#topic").focus(); return; }
  $("#go").disabled = true;
  await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ topic, voice: $("#voice").value, captions: $("#captions").checked }) });
  $("#go").disabled = false;
  $("#topic").value = "";
  refresh();
};

const open = new Set();
async function toggleScript(id) {
  const el = document.getElementById("sc-" + id);
  if (open.has(id)) { open.delete(id); el.style.display = "none"; return; }
  const s = await (await fetch(`/api/jobs/${id}/story`)).json();
  el.textContent = s.scenes.map((x) => x.narration).join("\n");
  el.style.display = "block"; open.add(id);
}

async function retry(id) { await fetch(`/api/jobs/${id}/retry`, { method: "POST" }); refresh(); }

let last = "";
async function refresh() {
  const jobs = await (await fetch("/api/jobs")).json();
  const sig = JSON.stringify(jobs);
  if (sig === last) return;
  last = sig;
  $("#jobs").innerHTML = jobs.map((j) => `
    <div class="job">
      ${j.state === "done" ? `<video src="/api/jobs/${j.id}/video" controls preload="metadata"></video>`
        : `<div class="ph"><div>${j.state === "error" ? "⚠️" : '<div class="spin"></div>'}${esc(j.step)}</div></div>`}
      <div class="meta">
        <div class="title">${esc(j.title || "Senza titolo")}</div>
        <div class="topic">${esc(j.topic)}</div>
        <div class="state ${j.state}">${LABEL[j.state] || j.state}${j.duration ? ` · ${j.duration}s` : ""}</div>
        ${j.error ? `<div class="err">${esc(j.error)}</div>` : ""}
        <div class="acts">
          ${j.state === "done" ? `<a href="/api/jobs/${j.id}/video" download>⬇ Scarica</a>` : ""}
          ${j.title ? `<button onclick="toggleScript('${j.id}')">📜 Copione</button>` : ""}
          ${j.state === "done" || j.state === "error" ? `<button onclick="retry('${j.id}')">🔁 Rifai</button>` : ""}
        </div>
        <div class="script" id="sc-${j.id}"></div>
      </div>
    </div>`).join("") || `<p class="sub">Ancora nessun video.</p>`;
}

loadVoices(); refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
